name: publish to mcp registry

# 打 `v*` tag 時，把 server.json 發布到官方 MCP Registry。
#
# 不建置、不發套件：這是遠端伺服器，registry 條目只有 `remotes` 指向線上端點。
# 這支 workflow 唯一的工作是把 server.json 送上去。
#
# 用 OIDC 而不是 PAT：不需要任何長期 secret，`id-token: write` 換來的是一次性的憑證。
# job 放在 `mcp-registry` environment 底下：要 required reviewer 核准，而且只有 `v*` tag 能部署。
# 沒有這道閘門，一個被盜的 write 權限帳號打一個 tag，就能把 server.json 的 remotes[0].url 改掉，
# 所有從 registry 安裝的人跟著改連線目標。發布後可用 `npm run check-registry` 比對線上條目。
#
# Registry 成功後，第二個 job 在 Smithery（taux/carbon）重新發布，讓它重新掃描工具。
# 那一步用長期的 SMITHERY_API_KEY，存在 `mcp-registry` 的 environment secret 裡。
#
# 發版步驟見 docs/deployment.md 的「發版與送件」。

on:
  push:
    tags: ["v*"]
  # 手動重發：registry 標示為 preview，官方明說可能有資料重置，屆時不必為了重發硬打一個新 tag。
  # smithery_only：只重跑 Smithery（例如改了 .github/smithery.json）。同一個版本不能在 registry 重發，
  # 那一步會失敗而把 Smithery 擋掉。environment 只允許 `v*` tag，所以要在 tag 上觸發。
  workflow_dispatch:
    inputs:
      smithery_only:
        description: "只更新 Smithery（不發布到 registry）"
        type: boolean
        default: false

concurrency:
  group: publish-mcp
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: ${{ !inputs.smithery_only }}
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # tag 是版本的單一來源；server.json 裡的版本只是為了本機驗證與測試而存在。
      - name: sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "server.json version -> $VERSION"

      - name: install mcp-publisher (pinned + verified)
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$ASSET" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher
          rm -f "$ASSET"

      - name: validate server.json
        run: ./mcp-publisher validate

      - name: authenticate
        run: ./mcp-publisher login github-oidc

      - name: publish
        run: ./mcp-publisher publish

  # 獨立的 job：上面的 job 握有 id-token: write，同一個 job 裡的程式都換得到改寫 registry 條目的憑證，
  # 第三方的 smithery CLI 不該和它待在一起。這裡只拿得到 SMITHERY_API_KEY，而它是長期金鑰，
  # 所以 action 釘到 commit SHA，CLI 由 .github/smithery-cli 的 lockfile 鎖住整棵相依樹，
  # 用 `npm ci --ignore-scripts` 安裝。同一個 environment：金鑰只在核准後才讀得到。
  smithery:
    needs: publish
    # publish 被 smithery_only 跳過時照樣跑；publish 失敗時不跑。
    if: ${{ always() && (needs.publish.result == 'success' || inputs.smithery_only) }}
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: install smithery CLI
        working-directory: .github/smithery-cli
        run: npm ci --ignore-scripts
      - name: publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: .github/smithery-cli/node_modules/.bin/smithery mcp publish https://carbon.taux.io/mcp -n taux/carbon
      # 顯示名稱與說明只在 .github/smithery.json 維護，每次發布都同步過去，網頁上改的會被覆蓋。
      - name: sync Smithery listing metadata
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          curl -fsS -X PATCH "https://api.smithery.ai/servers/taux%2Fcarbon" \
            -H "Authorization: Bearer ${SMITHERY_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @.github/smithery.json -o /dev/null -w "HTTP %{http_code}\n"
